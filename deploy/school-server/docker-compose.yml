# =============================================================================
# KobeAI School Server — full on-prem stack
# Run from the repo root:  docker compose -f deploy/school-server/docker-compose.yml up -d
# Or use the install.sh bootstrap which wires up /opt/kobeai for the admin CLI.
# =============================================================================

name: kobeai

services:
  postgres:
    image: postgres:16-alpine
    container_name: kobeai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kobeai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kobeai}
      POSTGRES_DB: ${POSTGRES_DB:-kobeai}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kobeai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [kobeai]

  redis:
    image: redis:7-alpine
    container_name: kobeai-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [kobeai]

  ollama:
    image: ollama/ollama:latest
    container_name: kobeai-ollama
    restart: unless-stopped
    volumes:
      - ./data/ollama:/root/.ollama
    ports:
      - "11434:11434"
    # Uncomment if the school server has an NVIDIA GPU
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [kobeai]

  migrate:
    build:
      context: ../..
      dockerfile: deploy/school-server/Dockerfile.migrate
    image: kobeai/migrate:latest
    container_name: kobeai-migrate
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kobeai}:${POSTGRES_PASSWORD:-kobeai}@postgres:5432/${POSTGRES_DB:-kobeai}
    networks: [kobeai]

  backend:
    build:
      context: ../..
      dockerfile: deploy/school-server/Dockerfile.api
    image: kobeai/backend:latest
    container_name: kobeai-backend
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      migrate:  { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: postgres://${POSTGRES_USER:-kobeai}:${POSTGRES_PASSWORD:-kobeai}@postgres:5432/${POSTGRES_DB:-kobeai}
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      AI_PROVIDER: ${AI_PROVIDER:-canned}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral:7b}
      KOBEVISION_SHARED_SECRET: ${KOBEVISION_SHARED_SECRET}
      K9_SHARED_SECRET: ${K9_SHARED_SECRET}
      K9_RUNTIME_URL: http://k9-runtime:8091
      SCHOOL_TIMEZONE: ${SCHOOL_TIMEZONE:-Africa/Dar_es_Salaam}
      PRESENCE_CHECKPOINT_MINUTES: ${PRESENCE_CHECKPOINT_MINUTES:-30}
      PRESENCE_MATCH_THRESHOLD: ${PRESENCE_MATCH_THRESHOLD:-0.86}
      PRESENCE_EXPECTED_ZONE_LOOKBACK_MINUTES: ${PRESENCE_EXPECTED_ZONE_LOOKBACK_MINUTES:-10}
      PRESENCE_CAMPUS_SEARCH_LOOKBACK_MINUTES: ${PRESENCE_CAMPUS_SEARCH_LOOKBACK_MINUTES:-30}
    ports:
      - "8000:8000"
    networks: [kobeai]

  # Local face detection + recognition. Model weights are intentionally not
  # bundled: mount a properly licensed InsightFace-compatible model pack under
  # ./data/vision/insightface/models/<VISION_MODEL_PACK>.
  vision:
    build:
      context: ../../services/kobevision
      dockerfile: Dockerfile
    image: kobeai/vision:latest
    container_name: kobeai-vision
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      KOBEAI_BASE_URL: http://backend:8000
      KOBEVISION_SHARED_SECRET: ${KOBEVISION_SHARED_SECRET}
      VISION_TEMPLATE_KEY: ${VISION_TEMPLATE_KEY}
      VISION_MODEL_PACK: ${VISION_MODEL_PACK:-antelopev2}
      VISION_MODEL_ROOT: /state/insightface
      VISION_TEMPLATE_STORE: /state/templates.enc
      VISION_EXECUTION_PROVIDER: ${VISION_EXECUTION_PROVIDER:-CPUExecutionProvider}
      VISION_MATCH_THRESHOLD: ${VISION_FACE_MATCH_THRESHOLD:-0.60}
      VISION_DETECTION_THRESHOLD: ${VISION_DETECTION_THRESHOLD:-0.60}
      VISION_CAMERA_SAMPLE_FPS: ${VISION_CAMERA_SAMPLE_FPS:-1.0}
      VISION_EVENT_DEDUP_SECONDS: ${VISION_EVENT_DEDUP_SECONDS:-15}
      VISION_CAMERAS_JSON: ${VISION_CAMERAS_JSON:-[]}
    volumes:
      - ./data/vision:/state
    ports:
      - "8090:8090"
    # For NVIDIA inference, set VISION_EXECUTION_PROVIDER=CUDAExecutionProvider
    # and enable the device reservation below on hosts with NVIDIA Container Toolkit.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    networks: [kobeai]

  # K9's local model gateway. It mounts the existing downloader tree read-only
  # and lazy-loads individual models only when a capability needs them.
  k9-runtime:
    build:
      context: ../../services/k9-runtime
      dockerfile: Dockerfile
    image: kobeai/k9-runtime:latest
    container_name: kobeai-k9-runtime
    restart: unless-stopped
    environment:
      K9_MODEL_ROOT: /models/k9
      K9_SHARED_SECRET: ${K9_SHARED_SECRET}
      K9_DEVICE: ${K9_DEVICE:-auto}
      K9_GGUF_CONTEXT: ${K9_GGUF_CONTEXT:-8192}
      K9_GGUF_GPU_LAYERS: ${K9_GGUF_GPU_LAYERS:--1}
    volumes:
      - ${K9_MODEL_ROOT_HOST:-./data/models/k9}:/models/k9:ro
    ports:
      - "127.0.0.1:8091:8091"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    # For NVIDIA inference, set K9_DEVICE=cuda and enable a GPU reservation
    # appropriate for the host's Docker/NVIDIA runtime.
    networks: [kobeai]

  # K-9 sees the physical school LAN and discovers/fingerprints cameras, DVRs,
  # NVRs and other devices. Host networking is required for ARP/ping discovery.
  # The dashboard stays loopback-only because it exposes host-level audit tools.
  k9:
    build:
      context: ../../services/k9-network
      dockerfile: Dockerfile
    image: kobeai/k9:latest
    container_name: kobeai-k9
    restart: unless-stopped
    network_mode: host
    command: ["--web", "--bind", "127.0.0.1", "--no-open"]
    volumes:
      - ./data/k9:/data

  # Periodically runs K-9's machine-readable scanner and syncs the resulting LAN
  # inventory into the authenticated KobeAI admin API. It does not run K-9's
  # password-testing or other active audit tiers automatically.
  k9-sync:
    build:
      context: ../..
      dockerfile: services/k9-bridge/Dockerfile
    image: kobeai/k9-sync:latest
    container_name: kobeai-k9-sync
    restart: unless-stopped
    depends_on:
      - backend
    network_mode: host
    environment:
      KOBEAI_BASE_URL: http://127.0.0.1:8000
      K9_SHARED_SECRET: ${K9_SHARED_SECRET}
      K9_NETWORK: ${K9_NETWORK:-}
      K9_SCAN_MODE: ${K9_SCAN_MODE:-quick}
      K9_SYNC_INTERVAL_SECONDS: ${K9_SYNC_INTERVAL_SECONDS:-300}
    volumes:
      - ./data/k9-sync:/data

  teacher:
    build:
      context: ../..
      dockerfile: deploy/school-server/Dockerfile.web
      args:
        ARTIFACT: teacher-dashboard
        BASE_PATH: /teacher/
    image: kobeai/teacher-dashboard:latest
    container_name: kobeai-teacher
    restart: unless-stopped
    ports:
      - "3000:80"
    networks: [kobeai]

  parent:
    build:
      context: ../..
      dockerfile: deploy/school-server/Dockerfile.web
      args:
        ARTIFACT: parent-app
    image: kobeai/parent-app:latest
    container_name: kobeai-parent
    restart: unless-stopped
    ports:
      - "5173:80"
    networks: [kobeai]

  nginx:
    image: nginx:1.27-alpine
    container_name: kobeai-nginx
    restart: unless-stopped
    depends_on: [backend, teacher, parent]
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [kobeai]

networks:
  kobeai:
    driver: bridge
