apiVersion: v1
kind: Namespace
metadata:
  name: k9
---
apiVersion: v1
kind: Secret
metadata:
  name: k9-secrets
  namespace: k9
type: Opaque
stringData:
  POSTGRES_PASSWORD: CHANGE-ME
  RUNTIME_SHARED_SECRET: CHANGE-ME
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k9-config
  namespace: k9
data:
  POSTGRES_DB: k9
  POSTGRES_USER: k9
  REDIS_URL: redis://k9-redis:6379
  K9_RUNTIME_URL: http://k9-runtime:8766
  K9_MODELS_ROOT: /models/k9
  KOBEOS_MODELS_ROOT: /models/base
---
apiVersion: v1
kind: Service
metadata:
  name: k9-postgres
  namespace: k9
spec:
  selector:
    app: k9-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: k9-postgres
  namespace: k9
spec:
  serviceName: k9-postgres
  replicas: 1
  selector:
    matchLabels:
      app: k9-postgres
  template:
    metadata:
      labels:
        app: k9-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: k9-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: k9-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: k9-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "k9", "-d", "k9"]
            initialDelaySeconds: 10
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: k9-redis
  namespace: k9
spec:
  selector:
    app: k9-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k9-redis
  namespace: k9
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k9-redis
  template:
    metadata:
      labels:
        app: k9-redis
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k9-models
  namespace: k9
spec:
  accessModes: ["ReadOnlyMany"]
  resources:
    requests:
      storage: 200Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k9-kobeos-models
  namespace: k9
spec:
  accessModes: ["ReadOnlyMany"]
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: k9-runtime
  namespace: k9
spec:
  selector:
    app: k9-runtime
  ports:
    - port: 8766
      targetPort: 8766
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k9-runtime
  namespace: k9
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k9-runtime
  template:
    metadata:
      labels:
        app: k9-runtime
    spec:
      containers:
        - name: runtime
          image: kobeai-k9-runtime:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8766
          env:
            - name: K9_MODELS_CONFIG
              value: /app/config/k9-models.json
            - name: K9_MODELS_ROOT
              valueFrom:
                configMapKeyRef:
                  name: k9-config
                  key: K9_MODELS_ROOT
            - name: KOBEOS_MODELS_ROOT
              valueFrom:
                configMapKeyRef:
                  name: k9-config
                  key: KOBEOS_MODELS_ROOT
            - name: K9_RUNTIME_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: k9-secrets
                  key: RUNTIME_SHARED_SECRET
          volumeMounts:
            - name: k9-models
              mountPath: /models/k9
              readOnly: true
            - name: kobeos-models
              mountPath: /models/base
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8766
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8766
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: k9-models
          persistentVolumeClaim:
            claimName: k9-models
        - name: kobeos-models
          persistentVolumeClaim:
            claimName: k9-kobeos-models
---
apiVersion: v1
kind: Service
metadata:
  name: k9-api
  namespace: k9
spec:
  selector:
    app: k9-api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k9-api
  namespace: k9
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k9-api
  template:
    metadata:
      labels:
        app: k9-api
    spec:
      containers:
        - name: api
          image: kobeai-k9-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: NODE_ENV
              value: production
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: k9-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://k9:$(POSTGRES_PASSWORD)@k9-postgres:5432/k9
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: k9-config
                  key: REDIS_URL
            - name: K9_RUNTIME_URL
              valueFrom:
                configMapKeyRef:
                  name: k9-config
                  key: K9_RUNTIME_URL
            - name: K9_FASTAPI_RUNTIME_URL
              value: http://k9-runtime:8766
            - name: K9_DESKTOP
              value: "1"
            - name: K9_RUNTIME_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: k9-secrets
                  key: RUNTIME_SHARED_SECRET
            - name: K9_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: k9-secrets
                  key: RUNTIME_SHARED_SECRET
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
