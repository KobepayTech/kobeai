name: Tablet App (Android)

on:
  push:
    paths:
      - "watch-app/**"
      - ".github/workflows/watch-app.yml"
  pull_request:
    paths:
      - "watch-app/**"
      - ".github/workflows/watch-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    name: assembleTabletDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: watch-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('watch-app/**/*.gradle*', 'watch-app/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: assemble tablet debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload tablet APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kobeai-tablet-debug
          path: watch-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
