name: Flatten vendored services into KobeAI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/flatten-vendored-services.yml

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout KobeAI without submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Vendor K-9 and KobeVoice as normal directories
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "KobepayTech Automation"
          git config user.email "159016310+KobepayTech@users.noreply.github.com"

          # Remove the gitlinks and submodule metadata from KobeAI.
          git rm -f services/k9-network services/kobevoice .gitmodules

          rm -rf /tmp/k9-src /tmp/kobevoice-src

          git clone https://github.com/nyfeblade/K-9.git /tmp/k9-src
          git -C /tmp/k9-src checkout 98e174c56b632b4ecd10e2a740cb46d8c94a161f
          rm -rf /tmp/k9-src/.git
          mkdir -p services/k9-network
          cp -a /tmp/k9-src/. services/k9-network/

          git clone https://github.com/KobepayTech/kobevoice.git /tmp/kobevoice-src
          git -C /tmp/kobevoice-src checkout 4758f163ffcd7bde5e9dc1b24b606b11369cf8e0
          rm -rf /tmp/kobevoice-src/.git
          mkdir -p services/kobevoice
          cp -a /tmp/kobevoice-src/. services/kobevoice/

          # The monorepo no longer has submodules, so do not ask CI to initialize them.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ci.yml')
          s = p.read_text()
          s = s.replace('      - uses: actions/checkout@v4\n        with:\n          submodules: recursive\n', '      - uses: actions/checkout@v4\n')
          p.write_text(s)
          PY

          # This workflow is one-time scaffolding; remove it in the flatten commit.
          rm -f .github/workflows/flatten-vendored-services.yml

          git add -A

          # Hard verification: both service roots must now contain ordinary files,
          # never mode 160000 gitlinks, and .gitmodules must be gone.
          test ! -f .gitmodules
          if git ls-files -s services/k9-network services/kobevoice | awk '$1 == "160000" {found=1} END {exit found ? 0 : 1}'; then
            echo "A submodule gitlink still exists" >&2
            exit 1
          fi
          test -f services/k9-network/k9.py
          test -f services/k9-network/LICENSE
          test -f services/kobevoice/README.md
          test -f services/kobevoice/agent/src/agent.py

          git status --short
          git commit -m "refactor: vendor K-9 and KobeVoice into single KobeAI repo"
          git push origin HEAD:main
