name: Glasses Android
on:
  pull_request:
    paths:
      - 'glasses/**'
      - 'artifacts/teacher-lens/**'
      - '.github/workflows/glasses-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Lens and SDK test dependencies
        run: pnpm --filter @workspace/glasses --filter @workspace/teacher-lens --filter @workspace/scripts install --frozen-lockfile
      - name: Test bridge and build bundled Lens
        run: |
          pnpm --filter @workspace/glasses test
          pnpm --filter @workspace/glasses typecheck
          pnpm --filter @workspace/teacher-lens typecheck
          pnpm --filter @workspace/teacher-lens build
      - name: Test teacher workspace in a mobile browser
        run: |
          npm install --prefix "$RUNNER_TEMP/lens-browser" --package-lock=false --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/lens-browser/node_modules/.bin/playwright" install --with-deps chromium
          python3 -m http.server 5178 --bind 127.0.0.1 --directory artifacts/teacher-lens/dist/public > "$RUNNER_TEMP/lens-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5178/ > /dev/null; then break; fi
            sleep 1
          done
          NODE_PATH="$RUNNER_TEMP/lens-browser/node_modules" node artifacts/teacher-lens/tests/workspace.cjs
      - name: Compile both native hardware variants
        working-directory: glasses/android
        run: ./gradlew :app:assembleCompanionDebug :app:assembleRayneoDebug --stacktrace
