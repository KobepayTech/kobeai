name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real Postgres for the tests that are nothing but SQL: transactions,
    # advisory locks, ON CONFLICT. Without K9_TEST_DATABASE_URL those tests
    # skip themselves, which is how the lens upload route went untested.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: k9
          POSTGRES_PASSWORD: k9
          POSTGRES_DB: k9test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U k9 -d k9test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test K9 model registry
        run: |
          python -m unittest discover -s services/k9-runtime -p 'test_*.py'
          python -m unittest discover -s services/k9-camera/tests -p 'test_*.py'
          python -m unittest discover -s services/k9-classroom-gateway/tests -p 'test_*.py'

      - name: Compile K9 runtime Python
        run: python -m py_compile services/k9-runtime/model_registry.py services/k9-runtime/app.py

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Create test database schema
        run: pnpm --filter @workspace/db run push-force
        env:
          DATABASE_URL: postgres://k9:k9@127.0.0.1:5432/k9test

      - name: Test
        run: pnpm -r --if-present run test
        env:
          K9_TEST_DATABASE_URL: postgres://k9:k9@127.0.0.1:5432/k9test

      - name: Build
        run: pnpm run build
