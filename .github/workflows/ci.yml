name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test K9 model registry
        run: |
          python -m unittest discover -s services/k9-runtime -p 'test_*.py'
          python -m unittest discover -s services/k9-camera/tests -p 'test_*.py'

      - name: Compile K9 runtime Python
        run: python -m py_compile services/k9-runtime/model_registry.py services/k9-runtime/app.py

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm -r --if-present run test

      - name: Build
        run: pnpm run build
